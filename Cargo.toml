[workspace]
resolver = "2"
members = ["crates/muse-client", "crates/muse-adapter"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/latekaapi/harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
crossbeam-channel = "0.5"

# Path dependencies on the aui library.
aui-protocol = { path = "../agentic-ui/crates/aui-protocol" }

# Internal crates
muse-client = { path = "crates/muse-client" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
