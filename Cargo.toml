[workspace]
resolver = "2"
members = ["crates/muse-client", "crates/muse-adapter", "crates/baaz", "crates/provider", "crates/provider-muse", "crates/provider-claude-code"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["latekaapi"]
description = "A native macOS chat client for Meta's Muse Code agent, built with gpui and the aui component library."
readme = "README.md"
repository = "https://github.com/latekaapi/baaz"
keywords = ["muse", "agent", "chat", "gpui", "macos"]
categories = ["gui", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
crossbeam-channel = "0.5"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = "0.25"
base64 = "0.22"
ignore = "0.4"
libc = "0.2"
pdf-extract = "0.8"
calamine = "0.26"
zip = "2"

# gpui, pinned to the exact version agentic-ui resolves, so `cargo tree -d` shows
# one gpui-pre and one gpui-kit here and the two repositories build the same
# library code. agentic-ui states `^0.3.1`; its lock is 0.3.3.
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui-kit = "0.6.0"

# The aui component library, pinned to a tag rather than tracked on a branch:
# `aui` is pre-1.0 and breaks between minor versions, so a moving `main`
# would break this build at a time of its choosing. All six entries share
# one tag — they are one workspace and are only ever released together.
#
# To build against a local checkout instead (developing both at once), add a
# patch to `.cargo/config.toml` or the workspace root rather than editing
# these lines; `CONTRIBUTING.md` has the snippet.
aui = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6" }
aui-protocol = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6" }
aui-motion = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6" }
aui-tokens = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6" }
aui-icons = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6" }
aui-terminal = { git = "https://github.com/latekaapi/agentic-ui", tag = "v0.2.6", features = ["pty", "tui"] }

# Internal crates
muse-client = { path = "crates/muse-client" }
muse-adapter = { path = "crates/muse-adapter" }
provider = { path = "crates/provider" }
provider-muse = { path = "crates/provider-muse" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
