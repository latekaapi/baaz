[package]
name = "baaz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Baaz: a macOS chat interface to Meta's Muse Code agent, built on the aui component library."
# The app itself is not meant to be published to crates.io (it is a binary,
# distributed as a signed .app bundle, not a library).
publish = false

[dependencies]
# `test-support` exposes `Window::render_to_image`, which `--screenshot` uses,
# exactly as the gallery's own capture path does.
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui-kit.workspace = true
aui.workspace = true
aui-protocol.workspace = true
aui-motion.workspace = true
aui-tokens.workspace = true
aui-icons.workspace = true
muse-client.workspace = true
muse-adapter.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
uuid.workspace = true
rusqlite.workspace = true
chrono.workspace = true
image.workspace = true
base64.workspace = true
ignore.workspace = true
pdf-extract.workspace = true
calamine.workspace = true
zip.workspace = true
# The billing-tier probe drives the muse TUI under a pseudo-terminal
# (`crates/baaz/src/tier.rs`); `openpty` and `TIOCSCTTY` are the whole use.
libc.workspace = true

[package.metadata.cargo-machete]
# `gpui_platform` has no direct `use` in this crate's source, so cargo-machete
# flags it, but it is not dead: its `test-support` feature is what makes
# `gpui`'s own `test-support` feature actually implement
# `Window::render_to_image` on this platform (B-DEAD, 2026-09-12 audit —
# verified by removing it: `--screenshot` then fails with "render_to_image
# not implemented for this platform"). Keep it.
ignored = ["gpui_platform"]
