[package]
name = "baaz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Baaz: a native macOS workspace for Claude Code, Codex and Muse Code, built on the aui component library."
# The app itself is not meant to be published to crates.io (it is a binary,
# distributed as a signed .app bundle, not a library).
publish = false

[features]
# On by default so every probe entry point (`cargo build -p baaz`,
# `cargo test`, `scripts/uiprobe.py`, `scripts/baaz-check.sh`, the perf
# scripts) keeps working as documented. The release bundle
# (`scripts/bundle.sh`) builds with `--no-default-features`, so the app a
# person runs carries no probe; `tests/probe_ratchet.rs` fails if it stops.
default = ["probe"]
# The Chromium page engine; without it the browser pane is WKWebView.
cef = ["dep:aui-cef"]
# The capture and scripting surface (docs/82 4.10): `--steps`,
# `--screenshot`, `--bench`, `--replay`, `--perf-*` and every other flag
# that exists only for them, the step verbs, the fixtures, and gpui's
# `test-support`, whose `Window::render_to_image` `--screenshot` uses,
# exactly as the gallery's own capture path does. A build without it
# refuses those flags and `BAAZ_DETERMINISTIC` (exit 2).
# Feedback Mode's note crop: `Window::render_to_image` is gpui's
# `test-support`. The release bundle turns this on (and nothing else of the
# probe) so a note taken in the shipped app keeps its window picture.
window-capture = ["gpui/test-support"]
probe = ["window-capture", "dep:gpui_platform", "gpui_platform/test-support", "baaz-core/probe"]

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, optional = true }
gpui-kit.workspace = true
aui = { workspace = true, features = ["tree-sitter"] }
aui-protocol.workspace = true
aui-motion.workspace = true
aui-tokens.workspace = true
aui-icons.workspace = true
aui-terminal.workspace = true
aui-webview.workspace = true
aui-cef = { workspace = true, optional = true }
session-store.workspace = true
# The window-free engine (docs/82 4.11): stores, models and pure logic; no gpui.
baaz-core.workspace = true
# The browser's window-free half (docs/82 4.11): tabs, history, bookmarks,
# ad blocking, the agent page tools and their policy.
baaz-browser-core.workspace = true
# Every provider, Muse included, through the seam (P4): `provider-muse` is
# the only crate that names Muse's wire; the ratchet in tests/seam_ratchet.rs
# keeps `muse-client` out of this crate.
provider.workspace = true
provider-muse.workspace = true
# P4: the effort picker reads the Codex catalog shape and the Claude Code
# reason from the adapters that own them, never from a Baaz-side copy.
provider-codex = { path = "../provider-codex" }
provider-claude-code = { path = "../provider-claude-code" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
uuid.workspace = true
rusqlite.workspace = true
chrono.workspace = true
image.workspace = true
base64.workspace = true
ignore.workspace = true
# Signals, pids and sockets: quit signals, the single-instance check, the
# stall watchdog and the terminal service.
libc.workspace = true

# Feedback mode's element probe hit-tests the window through macOS
# accessibility, in-process (`crates/baaz/src/feedback/probe.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
log = "0.4"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSArray"] }
raw-window-handle = "0.6"

# The render-cache and sidebar benches (docs/51 P2) run criterion from
# ignored tests: baaz is a binary crate, so a `benches/` target cannot reach
# the code it would time. No plots, no rayon.
[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
# The test platform (`TestAppContext`, `VisualTestContext`): unit tests get it
# whether or not `probe` is on.
gpui = { workspace = true, features = ["test-support"] }
# The core's test seams (temp state dirs, synchronous bridges) for this
# crate's tests, exactly as they had them while the modules lived here.
baaz-core = { workspace = true, features = ["test-support"] }
baaz-browser-core = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-machete]
# `gpui_platform` has no direct `use` in this crate's source, so cargo-machete
# flags it, but it is not dead: its `test-support` feature is what makes
# `gpui`'s own `test-support` feature actually implement
# `Window::render_to_image` on this platform (B-DEAD, 2026-09-12 audit —
# verified by removing it: `--screenshot` then fails with "render_to_image
# not implemented for this platform"). Keep it.
ignored = ["gpui_platform"]
