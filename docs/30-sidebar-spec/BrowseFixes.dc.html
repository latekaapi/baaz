<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse, inset card, loading, the Field</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#DEDEDE}
.fm{position:absolute;left:8px;top:48px;width:600px;box-sizing:border-box;padding:4px;border-radius:10px;background:#252525;box-shadow:inset 0 1px 0 0 rgba(255,255,255,.02),inset 0 0 0 1px rgba(255,255,255,.02),0 0 0 1px rgba(0,0,0,.12),0 1px 1px -0.5px rgba(0,0,0,.18),0 3px 3px -1.5px rgba(0,0,0,.18);z-index:5;font-size:13px;line-height:20px;color:#F5F5F5}
.fm .in{display:flex;align-items:center;gap:8px;height:36px;margin:-4px -4px 2px;padding:0 12px;border-bottom:1px solid rgba(245,245,245,.072)}
.fm .lead{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:#A3A3A3}
.fm .mh{display:flex;align-items:center;height:28px;padding:0 8px;font-size:12px;line-height:16px;color:#A3A3A3}
.fm .mr{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 0;border-radius:6px;color:#A3A3A3;white-space:nowrap}
.fm .mr.lit{background:rgba(255,255,255,.06);color:#F5F5F5}
.fm .mr .host{font-size:12px;line-height:16px;color:#A3A3A3;overflow:hidden;text-overflow:ellipsis}
.fm .mr .k{margin-left:auto;font-size:11px;line-height:14px;color:#A3A3A3}
.fm .mark{width:16px;height:16px;border-radius:4px;background:#2C2C2C;color:#A3A3A3;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.caret{display:inline-block;width:1px;height:14px;background:#F5F5F5;margin-left:1px;vertical-align:-2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #171717; position: relative; font-family: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #F5F5F5; overflow: hidden; display: flex;">

  <!-- the selected tab is loading: its favicon slot is FF's spinner (stroke 1.5 on a border-12% track, one 90° arc; 2 s spin) -->
  <dc-import name="Sidebar" variant="browse-loading" h="{{h}}" hint-size="260px,900px"></dc-import>

  <!-- the page card: FF sidebar `variant=inset` — 8 on top, right and bottom, none beside the sidebar; no hairline on the card and no sidebar border, so no double line anywhere; shadow-2 -->
  <div style="flex: 1 1 auto; min-width: 0; margin: 8px 8px 8px 0; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 1px 0 0 rgba(255,255,255,.01),inset 0 0 0 1px rgba(255,255,255,.02),0 1px 1px -0.5px rgba(0,0,0,.18); overflow: hidden; display: flex; flex-direction: column; color: #191B21;">
    <div style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 32px; gap: 24px; border-bottom: 1px solid #E2E5EB; font-size: 13px;">
      <span style="font-weight: 600; font-size: 15px;">UDISE+ · PGI</span>
      <span style="color: #4D5262;">Home</span><span style="color: #4D5262;">State scores</span><span style="color: #4D5262;">Report cards</span><span style="color: #4D5262;">Open data</span>
    </div>
    <div style="padding: 40px 48px; display: flex; flex-direction: column; gap: 24px; max-width: 1040px;">
      <div style="font-size: 32px; line-height: 40px; font-weight: 600;">State scores 2023-24</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="height: 8px; width: 92%; border-radius: 4px; background: #EFF1F5;"></span>
        <span style="height: 8px; width: 84%; border-radius: 4px; background: #EFF1F5;"></span>
        <span style="height: 8px; width: 60%; border-radius: 4px; background: #EFF1F5;"></span>
      </div>
    </div>
  </div>
  <!-- the progress line: 2 px, foreground on a border-12% track, determinate from the engine's progress, along the card's top edge between its corner radii.
       Adaptation: the native page covers anything gpui draws over the card, so the line rides the 8 px gap, flush on the card's top edge -->
  <div role="progressbar" aria-label="Loading page" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="position: absolute; top: 6px; left: 266px; right: 18px; height: 2px; border-radius: 1px; background: rgba(245,245,245,.12); overflow: hidden;">
    <div style="width: 40%; height: 100%; background: #F5F5F5;"></div>
  </div>

  <!-- the Field: FF DropdownSearch on top — a full-bleed 36 px row, no ring of its own, a border/60 divider under it; icon lit while it holds focus. The panel window carries no native rim or shadow and hugs nothing below the rows -->
  <div class="fm" role="dialog" aria-label="Open a page, switch tab or ask">
    <div class="in" role="combobox" aria-label="Search or type a URL">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span>state sc<span class="caret"></span></span>
      <span style="margin-left: auto; font-size: 11px; color: #A3A3A3;">esc</span>
    </div>
    <div class="mh">Ask</div>
    <div class="mr lit" role="option"><span class="lead"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2l1.4 3.6L13 7l-3.6 1.4L8 12l-1.4-3.6L3 7l3.6-1.4z"/></svg></span><span>Ask Claude about “state sc”</span><span class="k">⌘↩</span></div>
    <div class="mh">Switch to</div>
    <div class="mr" role="option"><span class="lead"><span class="mark">S</span></span><span>State scores 2023-24</span><span class="host">pgi.udiseplus.gov.in</span></div>
    <div class="mh">Search</div>
    <div class="mr" role="option"><span class="lead"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></span><span>Search the web for “state sc”</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 900 };
  }
}
</script>
</body>
</html>
