<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar at compact density</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#8489E0}a:hover{color:#9297EA}
</style>
</helmet>
<div style="width: 260px; height: 720px; background: #121317; display: flex; flex-direction: column; font-family: 'Geist', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #E8EAEF; overflow: hidden;">
  <dc-import name="Sidebar" variant="populated" h="{{h}}" row-h="{{rowH}}" fs="{{fs}}" hint-size="260px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rowH":{"editor":"enum","options":[28,32],"default":28,"section":"Compact ladder"},"fs":{"editor":"enum","options":[12,13],"default":13,"section":"Compact ladder"},"$preview":{"width":260,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 720, rowH: Number(this.props.rowH ?? 28), fs: Number(this.props.fs ?? 13) };
  }
}
</script>
</body>
</html>
