<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse mode, new tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#DEDEDE}
.tile{width: 72px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #A3A3A3;}
.tile span.g{width: 48px; height: 48px; border-radius: 8px; background: #252525; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; color: #A3A3A3;}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #171717; position: relative; font-family: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #F5F5F5; overflow: hidden; display: flex;">

  <dc-import name="Sidebar" variant="browse" h="{{h}}" hint-size="260px,900px"></dc-import>

  <!-- ⌘T: a new tab is the app's own surface: the Field inline (FF composer chrome: surface-3 here, focus edge foreground 20%), the pins, nothing else. Typing drops the Field's rows under it, as on the Field board -->
  <div style="flex: 1 1 auto; min-width: 0; margin: 8px 8px 8px 0; border-radius: 8px; background: #1E1E1E; border: 1px solid rgba(245,245,245,.12); box-shadow: inset 0 1px 0 0 rgba(255,255,255,.01),inset 0 0 0 1px rgba(255,255,255,.02),0 1px 1px -0.5px rgba(0,0,0,.18); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;">
    <div role="combobox" aria-label="Search or type a URL" style="width: 560px; box-sizing: border-box; padding: 8px; border-radius: 10px; background: #252525; box-shadow: 0 0 0 1px rgba(245,245,245,.20), 0 1px 1px -0.5px rgba(0,0,0,.18); display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px;">
      <svg style="margin-left: 4px;" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#A3A3A3" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span style="color: #A3A3A3; flex: 1 1 auto;">Search or type a URL</span>
      <span style="font-size: 11px; color: #A3A3A3;">⌘L</span>
    </div>
    <div style="display: flex; gap: 16px;">
      <div class="tile"><span class="g">U</span>Unified dashboard</div>
      <div class="tile"><span class="g">P</span>Performance</div>
      <div class="tile"><span class="g">D</span>Open data</div>
      <div class="tile"><span class="g">N</span>Survey reports</div>
      <div class="tile"><span class="g">G</span>GitHub</div>
      <div class="tile"><span class="g">L</span>Linear</div>
    </div>
    <div style="font-size: 12px; line-height: 16px; color: #A3A3A3;">Type to switch tabs, search, or ask Claude · ⌘↩ asks</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 900 };
  }
}
</script>
</body>
</html>
