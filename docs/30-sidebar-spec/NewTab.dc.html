<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse mode, new tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#8489E0}a:hover{color:#9297EA}
.tile{width: 72px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: #737985;}
.tile span.g{width: 48px; height: 48px; border-radius: 8px; background: #23262D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; color: #ABB0BB;}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #121317; position: relative; font-family: 'Geist', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #E8EAEF; overflow: hidden; display: flex;">

  <dc-import name="Sidebar" variant="browse" h="{{h}}" hint-size="260px,900px"></dc-import>

  <!-- a new tab is the app's own surface: one omnibox, the pins, nothing else -->
  <div style="flex: 1 1 auto; min-width: 0; margin: 8px 8px 8px 0; border-radius: 8px; background: #17181D; border: 1px solid #262930; box-shadow: 0 1px 2px rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;">
    <div style="width: 560px; height: 44px; border-radius: 8px; background: #1C1E24; box-shadow: 0 0 0 1px rgba(132,137,224,.38); display: flex; align-items: center; padding: 0 14px; gap: 10px; font-size: 15px;">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#737985" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span style="color: #737985; flex: 1 1 auto;">Search or type a URL</span>
      <span style="font-size: 11px; color: #737985;">⌘L</span>
    </div>
    <div style="display: flex; gap: 16px;">
      <div class="tile"><span class="g">U</span>Unified dashboard</div>
      <div class="tile"><span class="g">P</span>Performance</div>
      <div class="tile"><span class="g">D</span>Open data</div>
      <div class="tile"><span class="g">N</span>Survey reports</div>
      <div class="tile"><span class="g">G</span>GitHub</div>
      <div class="tile"><span class="g">L</span>Linear</div>
    </div>
    <div style="font-size: 12px; color: #4E535E;">Ask Claude to open a site, or ⌘⇧L to browse with it</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 900 };
  }
}
</script>
</body>
</html>
