<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse, new tab v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#DEDEDE}
.pr{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:6px;color:#A3A3A3;font-size:13px;line-height:20px;white-space:nowrap}
.pr.lit{background:rgba(255,255,255,.06);color:#F5F5F5}
.pr .t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pr .m{margin-left:auto;padding-left:16px;flex:none;font-size:12px;line-height:16px;color:#A3A3A3;font-variant-numeric:tabular-nums}
.pr .ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.mark{width:16px;height:16px;border-radius:4px;background:#2C2C2C;color:#A3A3A3;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.caret{display:inline-block;width:1px;height:16px;background:#F5F5F5;vertical-align:-3px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #171717; position: relative; font-family: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #F5F5F5; overflow: hidden; display: flex;">

  <dc-import name="Sidebar" variant="browse" h="{{h}}" hint-size="260px,900px"></dc-import>

  <!-- the card: FF sidebar `variant=inset` (owner 2026-10-11) — m-2 with no gap beside the sidebar, surface-2 + shadow-2, no hairline, container radius 10 -->
  <div style="flex: 1 1 auto; min-width: 0; margin: 8px 8px 8px 0; border-radius: 10px; background: #1E1E1E; box-shadow: inset 0 1px 0 0 rgba(255,255,255,.01),inset 0 0 0 1px rgba(255,255,255,.02),0 1px 1px -0.5px rgba(0,0,0,.18); overflow: hidden; display: flex; flex-direction: column; align-items: center;">
    <!-- one 560 column at a quarter of the height (not dead centre): the Field, then what to pick up -->
    <div style="width: 560px; margin-top: 200px; display: flex; flex-direction: column; gap: 24px;">
      <!-- the Field inline: FF InputMessage chrome (p-2, container radius, subtitle 14/20) one step up the ladder (surface-3 on the surface-2 card); focused at birth, so the edge is foreground 20% and the icon is lit -->
      <label style="display: flex; align-items: center; gap: 8px; box-sizing: border-box; height: 52px; padding: 8px 16px 8px 16px; border-radius: 10px; background: #252525; box-shadow: 0 0 0 1px rgba(245,245,245,.20), 0 1px 1px -0.5px rgba(0,0,0,.18); font-size: 14px; line-height: 20px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <span class="caret"></span>
        <input aria-label="Search, open a page, or ask" placeholder="Search, open a page, or ask" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; color: #F5F5F5; font: inherit; padding: 0;">
        <span style="flex: none; font-size: 11px; line-height: 14px; color: #A3A3A3;">⌘↵ asks</span>
      </label>
      <sc-if value="{{pickup}}" hint-placeholder-val="{{true}}">
        <div role="listbox" aria-label="Pick up where you left off" style="display: flex; flex-direction: column;">
          <!-- FF dropdown group label: caption 12/16, 28 tall, px-2 -->
          <div style="height: 28px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; line-height: 16px; color: #A3A3A3;">Pick up where you left off</div>
          <!-- FF menu rows: 36 tall, px-2, gap-2, item radius; muted at rest, foreground + stroke 2 when lit; the hovered row rides the fluid highlight -->
          <div class="pr lit" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Continuing a session handed off from Codex</span><span class="m">harness · 12m</span></div>
          <div class="pr" role="option" aria-selected="false"><span class="ic"><span class="mark">W</span></span><span class="t">Wikipedia</span><span class="m">wikipedia.org</span></div>
          <div class="pr" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Multi Agent Handoff Greeting</span><span class="m">harness · 1h</span></div>
          <div class="pr" role="option" aria-selected="false"><span class="ic"><span class="mark">I</span></span><span class="t">Internet Assigned Numbers Authority</span><span class="m">iana.org · closed</span></div>
          <div class="pr" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Settings Shortcuts Keymap Editor</span><span class="m">harness · yesterday</span></div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pickup":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 900, pickup: this.props.pickup ?? true };
  }
}
</script>
</body>
</html>
