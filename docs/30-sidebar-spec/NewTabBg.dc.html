<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse, new tab grounds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#DEDEDE}
.pr{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border-radius:6px;color:#A3A3A3;font-size:13px;line-height:20px;white-space:nowrap}
.pr.lit{background:rgba(255,255,255,.06);color:#F5F5F5}
.pr .t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pr .m{margin-left:auto;padding-left:16px;flex:none;font-size:12px;line-height:16px;color:#A3A3A3;font-variant-numeric:tabular-nums}
.pr .ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.mark{width:16px;height:16px;border-radius:4px;background:#2C2C2C;color:#A3A3A3;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.caret{display:inline-block;width:1px;height:16px;background:#F5F5F5;vertical-align:-3px}
.list{display:flex;flex-direction:column}
.list.glass{padding:4px;border-radius:12px;background:rgba(23,23,23,.62);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:inset 0 1px 0 0 rgba(255,255,255,.04),inset 0 0 0 1px rgba(255,255,255,.06),0 1px 1px -0.5px rgba(0,0,0,.18),0 3px 3px -1.5px rgba(0,0,0,.18)}
.list.glass .pr{color:#C7C7C7}
.list.glass .pr.lit{background:rgba(255,255,255,.08);color:#F5F5F5}
.list.glass .pr .m{color:#A3A3A3}
.blob{position:absolute;border-radius:50%}
</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #171717; position: relative; font-family: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #F5F5F5; overflow: hidden; display: flex;">

  <dc-import name="Sidebar" variant="browse" h="{{h}}" hint-size="260px,900px"></dc-import>

  <!-- the card (FF inset, owner 2026-10-11): the ground is the new tab's own, the chrome above it stays FF -->
  <div style="position: relative; flex: 1 1 auto; min-width: 0; margin: 8px 8px 8px 0; border-radius: 10px; background: #1E1E1E; box-shadow: inset 0 1px 0 0 rgba(255,255,255,.01),inset 0 0 0 1px rgba(255,255,255,.02),0 1px 1px -0.5px rgba(0,0,0,.18); overflow: hidden; display: flex; flex-direction: column; align-items: center;">

    <!-- A · subtle: two faint glows on surface-2 (warm top-left, cool bottom-right, 6-8 % alpha). Reads as the same calm app, just less flat -->
    <sc-if value="{{subtle}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(60% 55% at 18% 8%, rgba(255,184,128,.07), rgba(255,184,128,0) 70%), radial-gradient(55% 60% at 88% 96%, rgba(107,151,255,.08), rgba(107,151,255,0) 70%), radial-gradient(40% 40% at 70% 20%, rgba(186,140,255,.04), rgba(186,140,255,0) 70%), #1E1E1E;"></div>
    </sc-if>

    <!-- B · vibrant: a deep mesh (indigo, teal, plum) under a centre scrim so the column keeps 4.5:1 -->
    <sc-if value="{{vibrant}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(55% 60% at 12% 10%, #3A2E7A 0%, rgba(58,46,122,0) 70%), radial-gradient(50% 55% at 92% 18%, #0F5C6E 0%, rgba(15,92,110,0) 70%), radial-gradient(65% 60% at 70% 100%, #6E2C55 0%, rgba(110,44,85,0) 70%), radial-gradient(45% 45% at 30% 85%, #1D3E7A 0%, rgba(29,62,122,0) 70%), #15151C;"></div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(45% 50% at 50% 38%, rgba(15,15,18,.45), rgba(15,15,18,0) 75%);"></div>
    </sc-if>

    <!-- C · wallpaper: the Mac's own desktop picture, blurred 60 px and dimmed 40 % (the shapes here stand in for the owner's lake-at-dusk wallpaper) -->
    <sc-if value="{{wallpaper}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; inset: -80px; filter: blur(60px); background: linear-gradient(180deg, #2A3656 0%, #46557E 30%, #8C7FA0 46%, #D59A78 54%, #2E3F63 62%, #1B2847 100%);">
        <div class="blob" style="left: 6%; top: 40%; width: 46%; height: 26%; background: #1C2A43;"></div>
        <div class="blob" style="left: 56%; top: 36%; width: 40%; height: 30%; background: #22314F;"></div>
        <div class="blob" style="left: 30%; top: 8%; width: 40%; height: 22%; background: #5F6E99;"></div>
        <div class="blob" style="left: 70%; top: 70%; width: 30%; height: 30%; background: #10192E;"></div>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12,12,14,.40);"></div>
    </sc-if>

    <!-- the column: unchanged from NewTab2. On B and C the pick-up list sits on a frosted panel (surface-1 at 62 % + 24 px blur, FF shadow-3 ring) so muted text holds its contrast -->
    <div style="position: relative; width: 560px; margin-top: 200px; display: flex; flex-direction: column; gap: 24px;">
      <label style="display: flex; align-items: center; gap: 8px; box-sizing: border-box; height: 52px; padding: 8px 16px 8px 16px; border-radius: 10px; background: #252525; box-shadow: 0 0 0 1px rgba(245,245,245,.20), 0 1px 1px -0.5px rgba(0,0,0,.18), 0 3px 3px -1.5px rgba(0,0,0,.18); font-size: 14px; line-height: 20px;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
        <span class="caret"></span>
        <input aria-label="Search, open a page, or ask" placeholder="Search, open a page, or ask" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; color: #F5F5F5; font: inherit; padding: 0;">
        <span style="flex: none; font-size: 11px; line-height: 14px; color: #A3A3A3;">⌘↵ asks</span>
      </label>
      <div class="{{listCls}}" role="listbox" aria-label="Pick up where you left off">
        <div style="height: 28px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; line-height: 16px; color: #A3A3A3;">Pick up where you left off</div>
        <div class="pr lit" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Continuing a session handed off from Codex</span><span class="m">harness · 12m</span></div>
        <div class="pr" role="option" aria-selected="false"><span class="ic"><span class="mark">W</span></span><span class="t">Wikipedia</span><span class="m">wikipedia.org</span></div>
        <div class="pr" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Multi Agent Handoff Greeting</span><span class="m">harness · 1h</span></div>
        <div class="pr" role="option" aria-selected="false"><span class="ic"><span class="mark">I</span></span><span class="t">Internet Assigned Numbers Authority</span><span class="m">iana.org · closed</span></div>
        <div class="pr" role="option" aria-selected="false"><span class="ic"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></svg></span><span class="t">Settings Shortcuts Keymap Editor</span><span class="m">harness · yesterday</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"enum","options":["subtle","vibrant","wallpaper"],"default":"subtle","section":"Ground"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const bg = this.props.bg ?? 'subtle';
    return {
      h: 900,
      subtle: bg === 'subtle',
      vibrant: bg === 'vibrant',
      wallpaper: bg === 'wallpaper',
      listCls: bg === 'subtle' ? 'list' : 'list glass',
    };
  }
}
</script>
</body>
</html>
