<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#F5F5F5}a:hover{color:#DEDEDE}
</style>
</helmet>
<div style="width: 1432px; height: 720px; background: #171717; display: flex; gap: 32px; font-family: 'Inter', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: #F5F5F5; overflow: hidden;">
  <div style="width: 260px; height: 720px; display: flex; flex-direction: column;">
    <dc-import name="Sidebar" variant="loading" h="{{h}}" hint-size="260px,720px"></dc-import>
  </div>
  <div style="width: 261px; height: 720px; display: flex; flex-direction: column; border-left: 1px solid rgba(245,245,245,.12);">
    <dc-import name="Sidebar" variant="empty" h="{{h}}" hint-size="260px,720px"></dc-import>
  </div>
  <div style="width: 261px; height: 720px; display: flex; flex-direction: column; border-left: 1px solid rgba(245,245,245,.12);">
    <dc-import name="Sidebar" variant="hover" h="{{h}}" hint-size="260px,720px"></dc-import>
  </div>
  <div style="width: 261px; height: 720px; display: flex; flex-direction: column; border-left: 1px solid rgba(245,245,245,.12);">
    <dc-import name="Sidebar" variant="rename" h="{{h}}" hint-size="260px,720px"></dc-import>
  </div>
  <div style="width: 261px; height: 720px; display: flex; flex-direction: column; border-left: 1px solid rgba(245,245,245,.12);">
    <dc-import name="Sidebar" variant="menus" h="{{h}}" hint-size="260px,720px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1432,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 720 };
  }
}
</script>
</body>
</html>
